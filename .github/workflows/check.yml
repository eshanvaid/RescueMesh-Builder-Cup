name: RescueMesh checks and APK
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  web-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r server/requirements.txt
      - run: python -m pytest -q
      - run: npm ci --prefix web && npm run build --prefix web
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python3 scripts/bootstrap_android.py
      - run: ./android/gradlew -p android :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RescueMesh-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
  container:
    needs: web-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rescuemesh:ci .
      - name: Smoke-test the same-process dashboard and API
        run: |
          docker run -d --name rescuemesh-ci -p 127.0.0.1:8080:8080 -e RESCUEMESH_STORE=sqlite -e RESCUEMESH_DB=/tmp/rescuemesh.db rescuemesh:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/ | grep -q RescueMesh
          curl --fail --silent http://127.0.0.1:8080/api/incidents
          status=$(curl --silent --output /tmp/write-denial.txt --write-out '%{http_code}' --request POST http://127.0.0.1:8080/api/incidents/example/reassess)
          test "$status" = 401
      - if: always()
        run: docker logs rescuemesh-ci || true
